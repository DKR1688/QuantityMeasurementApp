services:
  mysql:
    image: mysql:8.0
    container_name: qma-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p${MYSQL_ROOT_PASSWORD}"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - qma-backend

  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    image: ${QMA_EUREKA_IMAGE:-qma-eureka}
    container_name: qma-eureka-server
    restart: unless-stopped
    ports:
      - "${EUREKA_PORT:-8761}:8761"
    networks:
      - qma-backend

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    image: ${QMA_AUTH_IMAGE:-qma-auth}
    container_name: qma-auth-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/authdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-admin@example.com}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-admin123}
    networks:
      - qma-backend

  quantity-service:
    build:
      context: .
      dockerfile: quantity-service/Dockerfile
    image: ${QMA_QUANTITY_IMAGE:-qma-quantity}
    container_name: qma-quantity-service
    restart: unless-stopped
    depends_on:
      eureka-server:
        condition: service_started
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - qma-backend

  history-service:
    build:
      context: .
      dockerfile: history-service/Dockerfile
    image: ${QMA_HISTORY_IMAGE:-qma-history}
    container_name: qma-history-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/historydb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - qma-backend

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    image: ${QMA_GATEWAY_IMAGE:-qma-gateway}
    container_name: qma-api-gateway
    restart: unless-stopped
    depends_on:
      eureka-server:
        condition: service_started
      auth-service:
        condition: service_started
      quantity-service:
        condition: service_started
      history-service:
        condition: service_started
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    networks:
      - qma-backend

volumes:
  mysql-data:

networks:
  qma-backend:
    driver: bridge
