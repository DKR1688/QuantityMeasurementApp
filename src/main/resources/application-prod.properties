# ===============================
# APPLICATION
# ===============================
spring.application.name=quantity-measurement-app
server.port=${PORT:8080}
spring.config.import=optional:file:.env[.properties]

# \u26A0\uFE0F REMOVE context-path (avoid breaking APIs)
# server.servlet.context-path=/api

# ===============================
# DATABASE (PRODUCTION)
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# HIKARI POOL
# ===============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ===============================
# JPA (STRICT)
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ===============================
# JWT (ENV BASED)
# ===============================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ===============================
# GOOGLE OAUTH2 (ENV BASED)
# ===============================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI}
app.oauth2.redirect-uri=${FRONTEND_BASE_URL}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# ===============================
# LOGGING (PROD)
# ===============================
logging.level.root=WARN
logging.level.com.quantity_measurement_app=INFO

# ===============================
# ERROR HANDLING
# ===============================
server.error.include-message=never
server.error.include-stacktrace=never

# ===============================
# ACTUATOR
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
