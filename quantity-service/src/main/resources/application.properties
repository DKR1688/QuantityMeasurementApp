server.port=${PORT:${SERVER_PORT:8082}}

spring.config.import=optional:file:.env[.properties],optional:file:quantity-service/.env[.properties],optional:file:../.env[.properties]

spring.application.name=${SPRING_APPLICATION_NAME:quantity-service}

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=${EUREKA_INSTANCE_PREFER_IP_ADDRESS:false}
eureka.instance.instance-id=${EUREKA_INSTANCE_INSTANCE_ID:${spring.application.name}:${server.port}}

jwt.secret=${JWT_SECRET:mySecretKey1234567890123456789012345678901234567890}

logging.level.org.springframework.cloud.gateway=${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_CLOUD_GATEWAY:DEBUG}
